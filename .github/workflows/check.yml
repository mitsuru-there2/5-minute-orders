name: Godot checks
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
      - name: Install locked development tools
        run: make tools
      - name: Install pinned Godot with checksum verification
        run: ./scripts/setup.sh
      - name: Format check, lint, import, test and boot
        run: ./scripts/check.sh
